
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNAB – Monitor MQTT Grupo 7</title>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<style>
body {
  font-family: system-ui, Segoe UI, sans-serif;
  margin: 0;
  background: #f6f7fb;
  color: #222;
}

header {
  background: #1f2a44;
  color: white;
  padding: 14px 20px;
}

header h1 {
  margin: 0;
  font-size: 18px;
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  padding: 16px;
  margin-bottom: 16px;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: end;
}

label {
  font-size: 12px;
  color: #555;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

input {
  padding: 7px 9px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

button {
  padding: 8px 16px;
  border: 0;
  border-radius: 6px;
  background: #2f6fed;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button.sec {
  background: #888;
}

#estado {
  font-size: 13px;
  margin-left: auto;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.g {
  background: white;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  padding: 20px;
  border-left: 6px solid #f032e6;
  max-width: 500px;
}

.g h3 {
  margin: 0 0 12px;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
}

.g .vals {
  display: flex;
  gap: 40px;
}

.g .v {
  font-size: 30px;
  font-weight: 600;
}

.g .t {
  font-size: 12px;
  color: #666;
}

.g .ts {
  font-size: 11px;
  color: #888;
  margin-top: 10px;
}

.g.stale {
  opacity: .45;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #bbb;
  display: inline-block;
}

.g.live .dot {
  background: #22c55e;
}

canvas {
  max-height: 320px;
}

#log {
  font-family: monospace;
  font-size: 12px;
  max-height: 160px;
  overflow: auto;
  background: #fafafa;
  padding: 8px;
  border-radius: 6px;
  white-space: pre;
}
</style>
</head>

<body>

<header>
  <h1>UNAB – Monitor de Sensores en Tiempo Real | Grupo 7</h1>
</header>

<div class="wrap">

  <div class="card">
    <div class="row">

      <label>Broker (WebSocket seguro)
        <input id="url" size="34"
        value="wss://broker.emqx.io:8084/mqtt">
      </label>

      <label>Tópico
        <input id="topic" size="24"
        value="Grupo7/UNAB/Datos">
      </label>

      <label>Usuario (opcional)
        <input id="user" size="10">
      </label>

      <label>Clave (opcional)
        <input id="pass" type="password" size="10">
      </label>

      <label>Dividir Temp. por
        <input id="divT" type="number"
        value="10" style="width:60px">
      </label>

      <label>Dividir Hum. por
        <input id="divH" type="number"
        value="10" style="width:60px">
      </label>

      <button id="btn">Conectar</button>
      <button id="sim" class="sec">Simular datos</button>

      <span id="estado">Desconectado</span>

    </div>
  </div>

  <!-- ÚNICA TARJETA: GRUPO 7 -->
  <div class="grid">

    <div class="g stale" id="g7">

      <h3>
        Grupo 7
        <span class="dot"></span>
      </h3>

      <div class="vals">

        <div>
          <div class="v" id="t7">–</div>
          <div class="t">Temperatura °C</div>
        </div>

        <div>
          <div class="v" id="h7">–</div>
          <div class="t">Humedad %</div>
        </div>

      </div>

      <div class="ts" id="ts7">Sin datos</div>

    </div>

  </div>

  <!-- GRÁFICO TEMPERATURA GRUPO 7 -->
  <div class="card">
    <canvas id="cT"></canvas>
  </div>

  <!-- GRÁFICO HUMEDAD GRUPO 7 -->
  <div class="card">
    <canvas id="cH"></canvas>
  </div>

  <div class="card">
    <b>Mensajes recibidos del Grupo 7</b>
    <div id="log"></div>
  </div>

</div>

<script>

// CONFIGURACIÓN
const GRUPO = 7;
const VENTANA_S = 300;
const SIN_DATOS_S = 30;

const t0 = Date.now();
let ultimo = null;

// GRÁFICOS
function mkChart(id, titulo, color) {

  return new Chart(document.getElementById(id), {

    type: 'line',

    data: {
      datasets: [{
        label: 'Grupo 7',
        data: [],
        borderColor: color,
        backgroundColor: color,
        tension: 0.3,
        pointRadius: 2,
        borderWidth: 2
      }]
    },

    options: {

      animation: false,
      responsive: true,
      parsing: false,

      plugins: {
        title: {
          display: true,
          text: titulo
        },
        legend: {
          position: 'bottom'
        }
      },

      scales: {

        x: {
          type: 'linear',
          ticks: {
            maxTicksLimit: 8,
            callback: v =>
              new Date(t0 + v * 1000).toLocaleTimeString()
          }
        },

        y: {
          beginAtZero: false
        }

      }

    }

  });

}

const chT = mkChart(
  'cT',
  'Temperatura Grupo 7 (°C)',
  '#f032e6'
);

const chH = mkChart(
  'cH',
  'Humedad Grupo 7 (%)',
  '#4363d8'
);

// AGREGAR DATOS AL GRÁFICO
function push(chart, y) {

  const x = (Date.now() - t0) / 1000;

  const ds = chart.data.datasets[0].data;

  ds.push({x, y});

  while (ds.length && ds[0].x < x - VENTANA_S) {
    ds.shift();
  }

  chart.options.scales.x.min = Math.max(0, x - VENTANA_S);
  chart.options.scales.x.max = x;

  chart.update('none');

}

// IDENTIFICAR GRUPO
function grupoDe(topic) {

  const m = topic.match(/grupo\s*0*(\d+)/i);

  return m ? parseInt(m[1]) : null;

}

// EXTRAER TEMPERATURA Y HUMEDAD
function extraer(topic, payload) {

  let temp = null;
  let hum = null;

  try {

    const o = JSON.parse(payload);

    if (o && typeof o === 'object') {

      for (const k in o) {

        const n = parseFloat(o[k]);

        if (isNaN(n)) continue;

        const kl = k.toLowerCase();

        if (kl.startsWith('te') && temp === null) {
          temp = n;
        }

        else if (kl.startsWith('hu') && hum === null) {
          hum = n;
        }

      }

    } else if (typeof o === 'number') {

      const tl = topic.toLowerCase();

      if (tl.includes('temp')) temp = o;
      else if (tl.includes('hum')) hum = o;

    }

  } catch(e) {

    const n = parseFloat(payload);
    const tl = topic.toLowerCase();

    if (!isNaN(n)) {

      if (tl.includes('temp')) temp = n;
      else if (tl.includes('hum')) hum = n;

    }

  }

  return {temp, hum};

}

// DIVISORES
const div = id => {

  const d = parseFloat(
    document.getElementById(id).value
  );

  return d ? d : 1;

};

// PROCESAR SOLO GRUPO 7
function procesar(topic, payload) {

  const g = grupoDe(topic);

  // IGNORAR TODOS LOS GRUPOS EXCEPTO EL 7
  if (g !== GRUPO) return;

  const log = document.getElementById('log');

  log.textContent =
    `${new Date().toLocaleTimeString()}  ${topic}  ${payload}\n`
    + log.textContent.slice(0, 8000);

  const {temp, hum} = extraer(topic, payload);

  if (temp !== null) {

    const x = +(temp / div('divT')).toFixed(1);

    document.getElementById('t7').textContent =
      x.toFixed(1);

    push(chT, x);

  }

  if (hum !== null) {

    const x = +(hum / div('divH')).toFixed(1);

    document.getElementById('h7').textContent =
      x.toFixed(1);

    push(chH, x);

  }

  ultimo = Date.now();

  document.getElementById('ts7').textContent =
    'Último dato: ' + new Date().toLocaleTimeString();

  const card = document.getElementById('g7');

  card.classList.remove('stale');
  card.classList.add('live');

}

// CONTROL DE DATOS
setInterval(() => {

  if (!ultimo || Date.now() - ultimo > SIN_DATOS_S * 1000) {

    const card = document.getElementById('g7');

    card.classList.add('stale');
    card.classList.remove('live');

  }

}, 2000);

// CONEXIÓN MQTT
let client = null;

const estado = document.getElementById('estado');
const btn = document.getElementById('btn');

btn.onclick = () => {

  if (client) {

    client.end(true);
    client = null;

    estado.textContent = 'Desconectado';
    btn.textContent = 'Conectar';

    return;

  }

  const opts = {

    clientId: 'web_' + Math.random().toString(16).slice(2,10),
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000

  };

  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;

  if (u) opts.username = u;
  if (p) opts.password = p;

  estado.textContent = 'Conectando…';

  client = mqtt.connect(
    document.getElementById('url').value.trim(),
    opts
  );

  client.on('connect', () => {

    const tp = document.getElementById('topic').value.trim();

    client.subscribe(tp, {qos: 0}, err => {

      estado.textContent = err
        ? 'Error al suscribir: ' + err.message
        : 'Conectado – Grupo 7';

    });

    btn.textContent = 'Desconectar';

  });

  client.on('message', (t, m) => {

    procesar(t, m.toString());

  });

  client.on('error', e => {

    estado.textContent = 'Error: ' + e.message;

  });

  client.on('close', () => {

    if (client) {
      estado.textContent = 'Reconectando…';
    }

  });

};

// CONEXIÓN AUTOMÁTICA
btn.click();

// SIMULACIÓN DE DATOS GRUPO 7
let simTimer = null;

document.getElementById('sim').onclick = (e) => {

  if (simTimer) {

    clearInterval(simTimer);
    simTimer = null;

    e.target.textContent = 'Simular datos';

    return;

  }

  e.target.textContent = 'Detener simulación';

  simTimer = setInterval(() => {

    procesar(
      'Grupo7/UNAB/Datos',
      JSON.stringify({
        Temperatura: Math.round(210 + Math.random() * 25),
        Humedad: Math.round(500 + Math.random() * 80)
      })
    );

  }, 1500);

};

</script>

</body>
</html>
